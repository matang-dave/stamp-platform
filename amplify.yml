version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # npm-workspaces monorepo: install at the repo root, then build the
            # shared @stamp/core package that apps/web imports.
            - cd ../..
            - npm ci
            - npm run build --workspace @stamp/core
            - cd apps/web
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
